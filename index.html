    <!-- ============================================================
         Tailwind, compilado en BUILD TIME
         ============================================================
         Antes acá vivían dos cosas: el CDN de Tailwind
         (cdn.tailwindcss.com) y ~90 líneas de configuración que armaban
         las escalas de color. El CDN no es una hoja de estilos: es un
         compilador que corría en el navegador de CADA usuario, mirando
         el DOM y generando el CSS sobre la marcha.

         En Blazor WASM eso se notaba: el framework renderizaba miles de
         elementos y Tailwind venía corriendo detrás. De ahí el parpadeo
         de colores al arrancar y el "muevo algo y se acomoda" — cada
         interacción disparaba una regeneración.

         Ahora el CSS se genera con el CLI durante el build (ver el Target
         CompilarTailwind en SIMON_WEB_360.csproj) y el navegador solo
         descarga una hoja ya minificada.

         La configuración se mudó a tailwind.config.js, en la raíz del
         proyecto. El theming por empresa NO cambió: los colores siguen
         viajando en variables CSS (--c-*) que inyecta js/tema.js en
         runtime, así que una empresa cambia su marca sin recompilar.
         ============================================================ -->
    <link rel="stylesheet" href="css/tailwind.build.css" />
    <!-- El tema de la empresa se pinta acá, antes de que arranque Blazor: con
         lo último que se cacheó de esta empresa y sin tocar la red. Si se
         esperara al framework, el usuario ve medio segundo de azul SIMON y
         después el salto a su marca. -->
    <script>
        // El modo claro/oscuro que el usuario dejo elegido, ANTES del primer
        // pintado. Va aca arriba y no al final del body por lo mismo que la
        // marca de la empresa: aplicado despues, la pantalla se ve un instante
        // en claro y despues salta a oscuro.
        //
        // Su propio try: si algo falla mas abajo, la preferencia igual quedo
        // puesta. localStorage puede tirar en modo privado de algunos
        // navegadores, y ahi simplemente se arranca en claro.
        try {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        } catch (e) { /* sin storage: queda el claro por defecto */ }
    </script>

<style>
    /* 100vw y NO "inset: 0". Mientras corre el video, Blazor ya pinta la app
       por debajo; si esa página es más alta que la pantalla aparece la barra
       de scroll de Windows (15 px), y con inset:0 el splash se angostaba esos
       15 px: el video, centrado, saltaba 7,5 px a la izquierda justo antes de
       cerrarse. 100vw incluye la barra, así que el ancho ya no cambia. Los
       elementos fixed no generan scroll, así que no aparece barra horizontal. */
    .splash-video-wrapper {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100vw;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.6s ease;
    }
    .splash-video-wrapper video {
        width: 150vw;
        max-width: 1000px;
        height: auto;
        flex-shrink: 0;
        -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 50%, transparent 100%);
        mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 50%, transparent 100%);
    }
    @media (max-width: 600px) {
        .splash-video-wrapper video {
            width: auto;
            height: 70vh;
            max-width: none;
        }
    }
    /* El video de SIMON trae el logo 25 px a la derecha del centro de su
       cuadro de 1920 (va de x=798 a x=1172: centro en 985, no en 960). En
       escritorio no se nota, pero en el celular el video se agranda para
       llenar la pantalla y el logo quedaba con 106 px de aire a la izquierda
       y 79 a la derecha en un iPhone. Se corrige moviendo el video 1,3% de su
       propio ancho (25/1920), que vale igual en cualquier pantalla.
       Sólo para ESTE video: el splash propio que cargue una empresa no tiene
       por qué venir corrido, y el script de abajo le saca la clase. */
    .splash-video-wrapper video.splash-simon {
        transform: translateX(-1.3%);
    }

    /* Fundido al cambiar de tema con la sesión ya abierta. La clase la pone y
       la quita tema.js, y dura 400 ms: dejarla fija convertiría cada hover del
       resto de la sesión en una animación. */
    html.tema-cambiando * {
        transition: background-color .4s ease, color .4s ease,
                    border-color .4s ease, fill .4s ease, stroke .4s ease !important;
    }
    @media (prefers-reduced-motion: reduce) {
        html.tema-cambiando * { transition: none !important; }
    }
</style>

<body class="bg-gray-100 dark:bg-noche-900">

    <!-- Splash FUERA de #app — Blazor no lo toca al cargar -->
    <div id="splash-screen" class="splash-video-wrapper">
        <video id="splash-video" class="splash-simon" autoplay muted playsinline preload="auto">
            <source src="videos/Splash_modoClaro.mp4" type="video/mp4" />
        </video>
    </div>

    <script>
        (function () {
            var splash = document.getElementById('splash-screen');
            var video  = document.getElementById('splash-video');

            // Video de arranque propio de la empresa, si tiene uno cargado.
            // Se cambia ANTES de que empiece a reproducirse; hacerlo después
            // se veria como un corte a mitad del splash.
            try {
                var propio = window.tema && tema.splashUrl && tema.splashUrl();
                if (propio) {
                    var fuente = video.querySelector('source');
                    fuente.src = propio;
                    // La corrección de centrado es para el video de SIMON.
                    video.classList.remove('splash-simon');
                    // El evento de error va en el <source> y no en el <video>:
                    // cuando falla una fuente, el que se entera es el source.
                    // Sin esto, un video mal cargado deja la pantalla en blanco
                    // hasta que salta el limite de 12s.
                    fuente.addEventListener('error', function () { cerrarSplash(); });
                    video.load();
                }
            } catch (e) { /* sin tema: queda el splash de SIMON */ }

            function cerrarSplash() {
                splash.style.opacity = '0';
                setTimeout(function () { splash.remove(); }, 650);
            }

            // Se cierra cuando el video termina
            video.addEventListener('ended', cerrarSplash);

            // Seguro: si el video falla o tarda más de 12s, cierra igual
            var limite = setTimeout(cerrarSplash, 12000);
            video.addEventListener('ended', function () { clearTimeout(limite); });
        })();
    </script>

        window.downloadFile = function (fileName, base64) {

    <script>
        function descargarPdfDesdeBase64(base64Data, nombreArchivo) {
            const byteCharacters = atob(base64Data);
            const byteArrays = [];

            for (let i = 0; i < byteCharacters.length; i += 512) {
                const slice = byteCharacters.slice(i, i + 512);
                const byteNumbers = new Array(slice.length);
                for (let j = 0; j < slice.length; j++) {
                    byteNumbers[j] = slice.charCodeAt(j);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }

            const blob = new Blob(byteArrays, { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = nombreArchivo || "Reporte.pdf";
            link.click();

            URL.revokeObjectURL(link.href);
        }
    </script>
    <script>
        window.downloadFileInNewTab = function (fileBytes, fileName) {
            const blob = new Blob([fileBytes]);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.target = '_blank'; // Abrir en nueva pestaña
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        };

        // (La preferencia guardada se aplica en el <head>, antes del primer
        //  pintado. Repetirla aca no agrega nada: la clase 'dark' ya esta
        //  puesta desde antes de que el DOM termine de cargar.)
        //
        // El topbar del modo oscuro es otro color: la franja del sistema tiene
        // que seguirlo o queda blanca sobre un header oscuro. Esto si va aca —
        // tema.js ya esta cargado y el DOM listo.
        document.addEventListener("DOMContentLoaded", function () {
            try { tema.pintarBarraNavegador(); } catch (e) { }
        });

        // Función para Blazor
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            try { tema.pintarBarraNavegador(); } catch (e) { }
        }

        // Fija el tema en vez de alternarlo. La configuración ofrece "claro" y
        // "oscuro" como dos opciones concretas, no un interruptor: con toggle,
        // elegir "claro" estando ya en claro dejaba la pantalla en oscuro.
        function setTheme(dark) {
            document.documentElement.classList.toggle("dark", dark);
            localStorage.setItem("theme", dark ? "dark" : "light");
            try { tema.pintarBarraNavegador(); } catch (e) { }
        }

    </script>

    <!-- ============================================================
         PWA: service worker y deteccion de version nueva
         ============================================================
         Ruta relativa porque la app no esta en la raiz del servidor.

         El registro pelado -register('service-worker.js') y nada mas- es lo que
         hacia que una publicacion no llegara a los usuarios. Dos motivos:

         1. Un service worker nuevo se instala pero queda EN ESPERA hasta que se
            cierran TODAS las pestañas de la app. Recargar con F5 no sirve: la
            pestaña nunca se queda sin controlador. En una PWA instalada, que la
            gente no cierra, la version vieja podia seguir viva por dias.

         2. updateViaCache: por defecto el navegador puede servir los
            importScripts del worker -service-worker-assets.js, que es el que
            lleva la VERSION- desde su propio cache HTTP. Con la lista vieja en
            la mano, el worker concluye que no hay nada nuevo. 'none' lo obliga
            a preguntarle al servidor.

         Aca no se muestra ningun cartel: esto solo DETECTA y deja el estado a
         mano en window.simonSW. Quien lo muestra es el modal de Configuracion
         (ModalConfiguracion.razor), que pone un signo de exclamacion en su
         menu lateral. Es a proposito que no interrumpa: la actualizacion
         recarga la pagina, y esta app se usa llenando formularios largos en el
         campo -a veces sin señal-, asi que el momento lo elige la persona.
         ============================================================ -->
    <script>
        window.simonSW = (function () {
            let enEspera = null;   // un worker instalado esperando su turno
            let yaActivo = false;  // un worker nuevo que YA tomo el control
            let pedido   = false;  // solo recargar si lo pidio el usuario
            let recargando = false;

            const api = {
                // Lo consulta ModalConfiguracion al abrirse.
                //
                // Son dos situaciones distintas y las dos significan "hay una
                // version nueva que esta pantalla todavia no esta usando":
                //
                //   enEspera → el worker nuevo se instalo y espera su turno.
                //   yaActivo → el worker nuevo YA tomo el control (porque
                //              onInstall llama a skipWaiting), pero esta pestaña
                //              sigue corriendo el codigo que cargo al abrirse.
                //
                // Sin el segundo caso el aviso no aparecia nunca: desde que el
                // worker se activa solo, casi nadie queda en el primero.
                hayVersionNueva: function () { return enEspera !== null || yaActivo; },

                // Lo llama el boton "Actualizar ahora".
                aplicar: function () {
                    // Ya controla el worker nuevo: alcanza con recargar para que
                    // la pagina pida los archivos nuevos.
                    if (!enEspera) {
                        if (!yaActivo) return false;
                        recargar();
                        return true;
                    }

                    pedido = true;
                    enEspera.postMessage('SKIP_WAITING');

                    // Red de seguridad: si en 3 segundos el worker nuevo no tomo
                    // el control, se recarga igual. Sin esto la pantalla se queda
                    // en "Actualizando..." para siempre -pasa, por ejemplo, contra
                    // un service worker viejo publicado antes de que existiera el
                    // handler de SKIP_WAITING-.
                    setTimeout(function () { recargar(); }, 3000);
                    return true;
                }
            };

            function recargar() {
                if (recargando) return;
                recargando = true;
                window.location.reload();
            }

            if (!('serviceWorker' in navigator)) return api;

            // Cada cuanto se le pregunta al servidor si hay version nueva. Sin
            // esto, el navegador solo chequea al navegar, y una PWA abierta toda
            // la jornada no navega nunca.
            const CADA = 15 * 60 * 1000;

            navigator.serviceWorker.addEventListener('controllerchange', function () {
                // Lo pidio la persona desde Configuracion: se recarga.
                if (pedido) { recargar(); return; }

                // Cambio solo: el worker nuevo se activo por su cuenta. NO se
                // recarga -seria tirarle la pantalla encima a alguien que quizas
                // esta a mitad de un formulario-, solo se deja anotado para que
                // el aviso de Configuracion lo muestre.
                yaActivo = true;
            });

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(function (reg) {
                    // Quedo uno esperando de una visita anterior.
                    if (reg.waiting && navigator.serviceWorker.controller) enEspera = reg.waiting;

                    reg.addEventListener('updatefound', function () {
                        const nuevo = reg.installing;
                        if (!nuevo) return;
                        nuevo.addEventListener('statechange', function () {
                            // Sin controller es la PRIMERA instalacion: no hay
                            // version vieja que reemplazar, no hay nada que avisar.
                            if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
                                enEspera = nuevo;
                            }
                        });
                    });

                    setInterval(function () { reg.update(); }, CADA);

                    // Volver a la app despues de un rato es el momento mas
                    // probable de que haya salido una version nueva.
                    document.addEventListener('visibilitychange', function () {
                        if (document.visibilityState === 'visible') reg.update();
                    });
                })
                .catch(function (e) { console.warn('Service worker: no se pudo registrar.', e); });

            return api;
        })();
    </script>
