    <!--  Tailwind -->
    <!-- ============================================================
         Tailwind, compilado en BUILD TIME
         ============================================================
         Antes acá vivían dos cosas: el CDN de Tailwind
         (cdn.tailwindcss.com) y ~90 líneas de configuración que armaban
         las escalas de color. El CDN no es una hoja de estilos: es un
         compilador que corría en el navegador de CADA usuario, mirando
         el DOM y generando el CSS sobre la marcha.

         En Blazor WASM eso se notaba: el framework renderizaba miles de
         elementos y Tailwind venía corriendo detrás. De ahí el parpadeo
         de colores al arrancar y el "muevo algo y se acomoda" — cada
         interacción disparaba una regeneración.

         Ahora el CSS se genera con el CLI durante el build (ver el Target
         CompilarTailwind en SIMON_WEB_360.csproj) y el navegador solo
         descarga una hoja ya minificada.

         La configuración se mudó a tailwind.config.js, en la raíz del
         proyecto. El theming por empresa NO cambió: los colores siguen
         viajando en variables CSS (--c-*) que inyecta js/tema.js en
         runtime, así que una empresa cambia su marca sin recompilar.
         ============================================================ -->
    <link rel="stylesheet" href="css/tailwind.build.css" />
    <!-- El tema de la empresa se pinta acá, antes de que arranque Blazor: con
         lo último que se cacheó de esta empresa y sin tocar la red. Si se
         esperara al framework, el usuario ve medio segundo de azul SIMON y
         después el salto a su marca. -->
    <script>
        // El modo claro/oscuro que el usuario dejo elegido, ANTES del primer
        // pintado. Va aca arriba y no al final del body por lo mismo que la
        // marca de la empresa: aplicado despues, la pantalla se ve un instante
        // en claro y despues salta a oscuro.
        //
        // Su propio try: si algo falla mas abajo, la preferencia igual quedo
        // puesta. localStorage puede tirar en modo privado de algunos
        // navegadores, y ahi simplemente se arranca en claro.
        try {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        } catch (e) { /* sin storage: queda el claro por defecto */ }
    </script>
    <script src="js/tema.js"></script>
    <script>tema.aplicarDesdeCache();</script>

<style>
    .splash-video-wrapper {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.6s ease;
    }
    .splash-video-wrapper video {
        width: 150vw;
        max-width: 1000px;
        height: auto;
        flex-shrink: 0;
        -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 50%, transparent 100%);
        mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 50%, transparent 100%);
    }
    @media (max-width: 600px) {
        .splash-video-wrapper video {
            width: auto;
            height: 70vh;
            max-width: none;
        }
    }

    /* Fundido al cambiar de tema con la sesión ya abierta. La clase la pone y
       la quita tema.js, y dura 400 ms: dejarla fija convertiría cada hover del
       resto de la sesión en una animación. */
    html.tema-cambiando * {
        transition: background-color .4s ease, color .4s ease,
                    border-color .4s ease, fill .4s ease, stroke .4s ease !important;
    }
    @media (prefers-reduced-motion: reduce) {
        html.tema-cambiando * { transition: none !important; }
    }
</style>

<body class="bg-gray-100 dark:bg-noche-900">

    <!-- Splash FUERA de #app — Blazor no lo toca al cargar -->
    <div id="splash-screen" class="splash-video-wrapper">
        <video id="splash-video" autoplay muted playsinline preload="auto">
            <source src="videos/Splash_modoClaro.mp4" type="video/mp4" />
        </video>
    </div>

    <script>
        (function () {
            var splash = document.getElementById('splash-screen');
            var video  = document.getElementById('splash-video');

            // Video de arranque propio de la empresa, si tiene uno cargado.
            // Se cambia ANTES de que empiece a reproducirse; hacerlo después
            // se veria como un corte a mitad del splash.
            try {
                var propio = window.tema && tema.splashUrl && tema.splashUrl();
                if (propio) {
                    var fuente = video.querySelector('source');
                    fuente.src = propio;
                    // El evento de error va en el <source> y no en el <video>:
                    // cuando falla una fuente, el que se entera es el source.
                    // Sin esto, un video mal cargado deja la pantalla en blanco
                    // hasta que salta el limite de 12s.
                    fuente.addEventListener('error', function () { cerrarSplash(); });
                    video.load();
                }
            } catch (e) { /* sin tema: queda el splash de SIMON */ }

            function cerrarSplash() {
                splash.style.opacity = '0';
                setTimeout(function () { splash.remove(); }, 650);
            }

            // Se cierra cuando el video termina
            video.addEventListener('ended', cerrarSplash);

            // Seguro: si el video falla o tarda más de 12s, cierra igual
            var limite = setTimeout(cerrarSplash, 12000);
            video.addEventListener('ended', function () { clearTimeout(limite); });
        })();
    </script>

    <script>
        window.downloadFile = function (fileName, base64) {
            const link = document.createElement('a');
            link.href = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64," + base64;
            link.download = fileName;
            link.click();
        }
    </script>
    <script>
        function descargarPdfDesdeBase64(base64Data, nombreArchivo) {
            const byteCharacters = atob(base64Data);
            const byteArrays = [];

            for (let i = 0; i < byteCharacters.length; i += 512) {
                const slice = byteCharacters.slice(i, i + 512);
                const byteNumbers = new Array(slice.length);
                for (let j = 0; j < slice.length; j++) {
                    byteNumbers[j] = slice.charCodeAt(j);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }

            const blob = new Blob(byteArrays, { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = nombreArchivo || "Reporte.pdf";
            link.click();

            URL.revokeObjectURL(link.href);
        }
    </script>
    <script>
        window.downloadFileInNewTab = function (fileBytes, fileName) {
            const blob = new Blob([fileBytes]);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.target = '_blank'; // Abrir en nueva pestaña
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        };

        // (La preferencia guardada se aplica en el <head>, antes del primer
        //  pintado. Repetirla aca no agrega nada: la clase 'dark' ya esta
        //  puesta desde antes de que el DOM termine de cargar.)
        //
        // El topbar del modo oscuro es otro color: la franja del sistema tiene
        // que seguirlo o queda blanca sobre un header oscuro. Esto si va aca —
        // tema.js ya esta cargado y el DOM listo.
        document.addEventListener("DOMContentLoaded", function () {
            try { tema.pintarBarraNavegador(); } catch (e) { }
        });

        // Función para Blazor
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            try { tema.pintarBarraNavegador(); } catch (e) { }
        }

        // Fija el tema en vez de alternarlo. La configuración ofrece "claro" y
        // "oscuro" como dos opciones concretas, no un interruptor: con toggle,
        // elegir "claro" estando ya en claro dejaba la pantalla en oscuro.
        function setTheme(dark) {
            document.documentElement.classList.toggle("dark", dark);
            localStorage.setItem("theme", dark ? "dark" : "light");
            try { tema.pintarBarraNavegador(); } catch (e) { }
        }

    </script>
