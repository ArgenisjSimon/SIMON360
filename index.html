    <!--  Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ============================================================
         Puente Tailwind ↔ tokens (fase 0 del tema por empresa)
         ============================================================
         Cada escala de color de Tailwind queda apuntando a un rol de
         css/tema-tokens.css. Con esto, los ~8.000 bg-blue-600 /
         text-emerald-500 que ya están escritos en los .razor se tiñen
         cambiando variables CSS, sin tocar un solo archivo.

         Hoy los tokens valen exactamente lo mismo que la paleta de
         fábrica de Tailwind 3.4.17, así que esto NO cambia ni un pixel:
         verificado tono por tono contra el bundle del CDN (110/110), con
         opacidades (bg-blue-600/40) y gradientes incluidos.

         La config va acá y no al final del body: si se declara después,
         el navegador alcanza a pintar con la config de fábrica y se ve
         el salto.
         ============================================================ -->
    <script>
        (function () {
            var NIVELES = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

            // Rol por escala. El azul y el índigo son marca; el resto son
            // semánticos y NO los pisa el tema de la empresa salvo que los
            // mande explícitos (un primario naranja no puede volver naranja
            // el "vencido").
            var ROLES = {
                blue: 'primary', indigo: 'primary-alt', emerald: 'accent',
                green: 'ok', red: 'crit', amber: 'warn',
                yellow: 'warn-soft', orange: 'warn-strong',
                purple: 'new', teal: 'info',
                // Secundarias: rose y cyan pintan las categorías del Home, así
                // que sin ellas el tema teñiría media pantalla.
                rose: 'crit-alt', cyan: 'info-alt', sky: 'info-soft',
                violet: 'new-alt', fuchsia: 'new-soft',
                // Neutros. gray son 12.443 usos: el esqueleto de la app.
                gray: 'neutral', slate: 'neutral-cool', zinc: 'neutral-flat'
            };

            // <alpha-value> es lo que mantiene vivas las clases con opacidad.
            function escala(rol) {
                var o = {};
                for (var i = 0; i < NIVELES.length; i++) {
                    o[NIVELES[i]] = 'rgb(var(--c-' + rol + '-' + NIVELES[i] + ') / <alpha-value>)';
                }
                return o;
            }

            var colors = {};
            for (var esc in ROLES) {
                colors[esc] = escala(ROLES[esc]);        // lo ya escrito: bg-blue-600
                colors[ROLES[esc]] = escala(ROLES[esc]); // para código nuevo: bg-primary-600
            }

            // Blanco y negro no son escalas, son colores sueltos, y bg-white
            // (880 usos) es el papel de tarjetas, header y modales: sin esto
            // un tema cambia los acentos y la app se sigue viendo blanca.
            // Cuidado: bg-white y text-white salen del mismo color, así que
            // --c-surface es papel Y tinta sobre botones de color. Ver la nota
            // en css/tema-tokens.css.
            colors.white = 'rgb(var(--c-surface) / <alpha-value>)';
            colors.black = 'rgb(var(--c-ink-max) / <alpha-value>)';
            colors.surface = colors.white;
            colors['ink-max'] = colors.black;

            // El chrome (barra y sidebar) tiene rol propio: es donde la marca
            // se planta, mientras el contenido queda claro.
            var PLANOS = ['rail', 'rail-ink', 'rail-ink-soft', 'rail-hover', 'topbar', 'marca',
                          'rail-crit', 'rail-crit-wash',
                          'lote', 'lote-borde'];

            // Superficies del modo oscuro. Escala corta y al reves: 900 es el
            // mas oscuro. Estaban escritas a mano como bg-noche-700 en ~340
            // lugares, fuera del alcance de cualquier tema.
            colors.noche = {};
            [400, 500, 600, 700, 800, 900].forEach(function (n) {
                colors.noche[n] = 'rgb(var(--c-noche-' + n + ') / <alpha-value>)';
            });
            for (var p = 0; p < PLANOS.length; p++) {
                colors[PLANOS[p]] = 'rgb(var(--c-' + PLANOS[p] + ') / <alpha-value>)';
            }

            // ── Las letras, aparte del papel ──────────────────────
            // En Tailwind, bg-gray-100 y text-gray-700 salen de la MISMA
            // escala, asi que pedir "las letras en otro color" arrastraba
            // el fondo detras. textColor tiene su propia entrada en la
            // config: se le da la escala ink y las clases de TEXTO pasan a
            // leer --c-ink-*, mientras bg-gray-* y border-gray-* siguen en
            // neutral. Cero cambios en los .razor.
            //
            // Solo gray: son 12.443 usos, el esqueleto de la app. slate y
            // zinc (96 y pocos mas) se quedan en su neutro — no justifican
            // otra escala de tokens.
            //
            // Los tokens de ink arrancan identicos a los de neutral, asi
            // que esto no cambia nada hasta que una empresa elija color.
            var textColor = { gray: escala('ink'), ink: escala('ink') };

            tailwind.config = {
                darkMode: 'class',
                theme: { extend: { colors: colors, textColor: textColor } }
            };
        })();
    </script>

<style>
    .splash-video-wrapper {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.6s ease;
    }
    .splash-video-wrapper video {
        width: 150vw;
        max-width: 1000px;
        height: auto;
        flex-shrink: 0;
        -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 50%, transparent 100%);
        mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 50%, transparent 100%);
    }
    @media (max-width: 600px) {
        .splash-video-wrapper video {
            width: auto;
            height: 70vh;
            max-width: none;
        }
    }

    /* Fundido al cambiar de tema con la sesión ya abierta. La clase la pone y
       la quita tema.js, y dura 400 ms: dejarla fija convertiría cada hover del
       resto de la sesión en una animación. */
    html.tema-cambiando * {
        transition: background-color .4s ease, color .4s ease,
                    border-color .4s ease, fill .4s ease, stroke .4s ease !important;
    }
    @media (prefers-reduced-motion: reduce) {
        html.tema-cambiando * { transition: none !important; }
    }
</style>

<body class="bg-gray-100 dark:bg-noche-900">

    <!-- Splash FUERA de #app — Blazor no lo toca al cargar -->
    <div id="splash-screen" class="splash-video-wrapper">
        <video id="splash-video" autoplay muted playsinline preload="auto">
            <source src="videos/Splash_modoClaro.mp4" type="video/mp4" />
        </video>
    </div>

    <script>
        (function () {
            var splash = document.getElementById('splash-screen');
            var video  = document.getElementById('splash-video');

            // Video de arranque propio de la empresa, si tiene uno cargado.
            // Se cambia ANTES de que empiece a reproducirse; hacerlo después
            // se veria como un corte a mitad del splash.
            try {
                var propio = window.tema && tema.splashUrl && tema.splashUrl();
                if (propio) {
                    var fuente = video.querySelector('source');
                    fuente.src = propio;
                    // El evento de error va en el <source> y no en el <video>:
                    // cuando falla una fuente, el que se entera es el source.
                    // Sin esto, un video mal cargado deja la pantalla en blanco
                    // hasta que salta el limite de 12s.
                    fuente.addEventListener('error', function () { cerrarSplash(); });
                    video.load();
                }
            } catch (e) { /* sin tema: queda el splash de SIMON */ }

            function cerrarSplash() {
                splash.style.opacity = '0';
                setTimeout(function () { splash.remove(); }, 650);
            }

            // Se cierra cuando el video termina
            video.addEventListener('ended', cerrarSplash);

            // Seguro: si el video falla o tarda más de 12s, cierra igual
            var limite = setTimeout(cerrarSplash, 12000);
            video.addEventListener('ended', function () { clearTimeout(limite); });
        })();
    </script>

        <!-- ⚠️ Error UI -->

    <script>
        window.downloadFile = function (fileName, base64) {
            const link = document.createElement('a');
            link.href = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64," + base64;
            link.download = fileName;
            link.click();
        }
    </script>
    <script>
        function descargarPdfDesdeBase64(base64Data, nombreArchivo) {
            const byteCharacters = atob(base64Data);
            const byteArrays = [];

            for (let i = 0; i < byteCharacters.length; i += 512) {
                const slice = byteCharacters.slice(i, i + 512);
                const byteNumbers = new Array(slice.length);
                for (let j = 0; j < slice.length; j++) {
                    byteNumbers[j] = slice.charCodeAt(j);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }

            const blob = new Blob(byteArrays, { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = nombreArchivo || "Reporte.pdf";
            link.click();

            URL.revokeObjectURL(link.href);
        }
    </script>
    <script>
        window.downloadFileInNewTab = function (fileBytes, fileName) {
            const blob = new Blob([fileBytes]);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.target = '_blank'; // Abrir en nueva pestaña
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        };

        // Cargar la preferencia guardada
        document.addEventListener("DOMContentLoaded", function () {
            const theme = localStorage.getItem("theme") || "light";
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            }
            // El topbar del modo oscuro es otro color: la franja del sistema
            // tiene que seguirlo o queda blanca sobre un header oscuro.
            try { tema.pintarBarraNavegador(); } catch (e) { }
        });

        // Función para Blazor
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            try { tema.pintarBarraNavegador(); } catch (e) { }
        }

        // Fija el tema en vez de alternarlo. La configuración ofrece "claro" y
        // "oscuro" como dos opciones concretas, no un interruptor: con toggle,
        // elegir "claro" estando ya en claro dejaba la pantalla en oscuro.
        function setTheme(dark) {
            document.documentElement.classList.toggle("dark", dark);
            localStorage.setItem("theme", dark ? "dark" : "light");
            try { tema.pintarBarraNavegador(); } catch (e) { }
        }

    </script>
